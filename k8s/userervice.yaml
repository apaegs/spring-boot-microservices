apiVersion: apps/v1
kind: Deployment
metadata:
  name: userservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: userservice
  template:
    metadata:
      labels:
        app: userservice
    spec:
      containers:
        - name: userservice
          image: spring-boot-microservices-userservice:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8081
            - containerPort: 9091
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: dev
            - name: SECURITY_OAUTH2_ISSUER
              value: http://authservice:9000
---
apiVersion: v1
kind: Service
metadata:
  name: userservice
spec:
  selector:
    app: userservice
  ports:
    - name: http
      port: 8081
      targetPort: 8081
    - name: grpc
      port: 9091
      targetPort: 9091
