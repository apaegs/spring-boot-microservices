<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat</title>
    <style>
        :root {
            --bg: #0f1115;
            --panel: #16191f;
            --panel-2: #1c2027;
            --border: #262b33;
            --text: #e6e8eb;
            --muted: #8b929c;
            --accent: #3b82f6;
            --accent-hover: #2f6fd6;
            --own-bubble: #3b82f6;
            --own-text: #ffffff;
            --other-bubble: #1c2027;
            --radius: 8px;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            max-width: 760px;
            margin: 0 auto;
            padding: 28px 20px 60px;
            font-size: 15px;
            line-height: 1.5;
        }
        h1 {
            font-size: 20px;
            font-weight: 600;
            margin: 0 0 4px;
        }
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--muted);
            font-size: 13px;
            margin-bottom: 22px;
        }
        .section {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 18px;
            margin: 16px 0;
        }
        .section h2 {
            font-size: 13px;
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin: 0 0 14px;
        }
        label {
            display: block;
            color: var(--muted);
            font-size: 13px;
            margin: 10px 0 4px;
        }
        input, textarea {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px 12px;
            font-family: inherit;
            font-size: 14px;
            border-radius: var(--radius);
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
        }
        button {
            background: var(--accent);
            border: none;
            color: #fff;
            padding: 10px 18px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            border-radius: var(--radius);
            margin-top: 12px;
            margin-right: 8px;
            transition: background 0.15s;
        }
        button.secondary {
            background: var(--panel-2);
            border: 1px solid var(--border);
            color: var(--text);
        }
        button:hover { background: var(--accent-hover); }
        button.secondary:hover { background: var(--border); }
        button.logout {
            background: var(--panel-2);
            border: 1px solid var(--border);
            color: var(--text);
            margin: 0;
            padding: 6px 14px;
            font-size: 13px;
        }
        button.logout:hover { background: var(--border); }
        #messages {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
            height: 360px;
            overflow-y: auto;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .row { display: flex; flex-direction: column; max-width: 75%; }
        .row.own { align-self: flex-end; align-items: flex-end; }
        .row.other { align-self: flex-start; align-items: flex-start; }
        .meta { font-size: 11px; color: var(--muted); margin: 0 4px 3px; }
        .bubble {
            padding: 9px 13px;
            border-radius: var(--radius);
            word-break: break-word;
            white-space: pre-wrap;
        }
        .row.own .bubble { background: var(--own-bubble); color: var(--own-text); }
        .row.other .bubble { background: var(--other-bubble); border: 1px solid var(--border); }
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }
    </style>
</head>
<body>
<h1>Chat</h1>
<div class="topbar">
    <span id="whoami">Loading…</span>
    <button class="logout" onclick="logout()">Log out</button>
</div>

<div class="section">
    <h2>Messages</h2>
    <div id="messages"></div>
    <label for="messageContent">Message</label>
    <textarea id="messageContent" placeholder="Write a message..." rows="3"></textarea>
    <button onclick="sendMessage()">Send</button>
    <button class="secondary" onclick="loadMessages()">Refresh</button>
</div>

<script>
    let currentUser = null;
    // Guards against overlapping loadMessages() calls (poll + Refresh + send).
    let isLoadingMessages = false;
    // If a refresh is requested while one is in flight, remember to run one more
    // afterwards, so e.g. sending a message always results in a visible update
    // instead of being dropped until the next poll.
    let pendingRefresh = false;

    function getCsrfToken() {
        const cookie = document.cookie.split(';').find(c => c.trim().startsWith('XSRF-TOKEN='));
        return cookie ? decodeURIComponent(cookie.split('=')[1].trim()) : null;
    }

    // Formats an ISO timestamp as "14:32, 3 Jun".
    function formatTime(iso) {
        const d = new Date(iso);
        if (isNaN(d)) return iso;
        const time = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
        const date = d.toLocaleDateString([], { day: 'numeric', month: 'short' });
        return time + ', ' + date;
    }

    async function loadMe() {
        try {
            const response = await fetch('/api/me', { credentials: 'include' });
            if (response.ok) {
                const data = await response.json();
                currentUser = data.username;
                document.getElementById('whoami').textContent = 'Signed in as ' + currentUser;
            }
        } catch (e) {
            console.error('loadMe failed:', e);
        }
    }

    async function sendMessage() {
        try {
            const content = document.getElementById('messageContent').value;

            const response = await fetch('/api/messages', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-XSRF-TOKEN': getCsrfToken()
                },
                credentials: 'include',
                body: JSON.stringify({ content })
            });

            if (response.ok) {
                document.getElementById('messageContent').value = '';
                loadMessages();
            } else {
                alert('Error sending message: ' + response.status);
            }
        } catch (e) {
            console.error('sendMessage failed:', e);
            alert('Network error, please try again.');
        }
    }

    async function loadMessages() {
        // If a fetch is already running, queue a single follow-up instead of
        // dropping this request, then return.
        if (isLoadingMessages) {
            pendingRefresh = true;
            return;
        }
        isLoadingMessages = true;
        try {
            const response = await fetch('/api/messages', {
                credentials: 'include'
            });

            if (response.ok) {
                const messages = await response.json();
                const div = document.getElementById('messages');
                const atBottom = div.scrollHeight - div.scrollTop - div.clientHeight < 40;
                div.innerHTML = '';
                messages.forEach(m => {
                    const isOwn = m.senderUsername === currentUser;

                    const row = document.createElement('div');
                    row.className = 'row ' + (isOwn ? 'own' : 'other');

                    const meta = document.createElement('div');
                    meta.className = 'meta';
                    meta.textContent = m.senderUsername + ' · ' + formatTime(m.sentAt);

                    const bubble = document.createElement('div');
                    bubble.className = 'bubble';
                    bubble.textContent = m.content;

                    row.appendChild(meta);
                    row.appendChild(bubble);
                    div.appendChild(row);
                });
                if (atBottom) div.scrollTop = div.scrollHeight;
            } else {
                document.getElementById('messages').textContent = 'Error loading messages: ' + response.status;
            }
        } catch (e) {
            console.error('loadMessages failed:', e);
            document.getElementById('messages').textContent = 'Network error loading messages.';
        } finally {
            isLoadingMessages = false;
            // If a refresh was requested while this one ran, run it now (once).
            if (pendingRefresh) {
                pendingRefresh = false;
                loadMessages();
            }
        }
    }

    function logout() {
        const form = document.createElement('form');
        form.method = 'POST';
        form.action = '/logout';

        const token = document.createElement('input');
        token.type = 'hidden';
        token.name = '_csrf';
        token.value = getCsrfToken() || '';
        form.appendChild(token);

        document.body.appendChild(form);
        form.submit();
    }

    // Self-scheduling poll: the next poll is only queued after the previous
    // loadMessages() finishes, so a slow network can't pile up requests.
    function scheduleNextPoll() {
        loadMessages().finally(() => setTimeout(scheduleNextPoll, 3000));
    }

    window.addEventListener('load', async function() {
        await fetch('/csrf', { credentials: 'include' });
        await loadMe();
        scheduleNextPoll();
    });
</script>
</body>
</html>
