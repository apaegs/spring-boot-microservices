<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat — Login</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 400px; margin: 100px auto; padding: 0 20px; text-align: center; }
        button { padding: 12px 24px; background: #007bff; color: white; border: none; cursor: pointer; font-size: 16px; border-radius: 4px; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
<h1>Chat</h1>
<p>Log in to start chatting.</p>
<button onclick="login()">Log in</button>

<script>
    function login() {
        window.location.href = '/oauth2/authorization/authservice';
    }
</script>
</body>
</html>
